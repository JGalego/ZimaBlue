# Codecov configuration.
#
# The interactive replay player drags the number down and always will: it is a
# matplotlib window whose job is to block on user input. Its logic is tested
# through the exporters and the renderer; the window plumbing is not, and
# pretending otherwise with a mocked event loop would test the mock.

coverage:
  precision: 1
  round: down
  range: "85...100"
  status:
    project:
      default:
        target: 90%
        # Small honest movements should not fail a pull request.
        threshold: 1%
    patch:
      default:
        # New code is held to a higher bar than the existing average, which is
        # how the average goes up rather than sideways.
        target: 90%
        threshold: 0%

comment:
  layout: "reach, diff, flags, files"
  require_changes: true

ignore:
  - "tests/**"
  - "examples/**"
  - "tools/**"
