[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "zimablue"
dynamic = ["readme", "version"]
description = "Simulate, test, and replay robotic pool cleaners."
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "JGalego" }]
keywords = [
    "robotics",
    "simulation",
    "pool-cleaner",
    "coverage-path-planning",
    "digital-twin",
    "replay",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
# Reading a photograph to trace a pool out of it. Separate from viz because a
# batch that builds pools from images has no reason to pull in a plotting stack.
image = ["pillow>=10"]
# Running a SAM export to segment a pool out of a photograph. onnxruntime and
# nothing else -- no torch, no CUDA, no 2 GB of wheels. Weights are yours to
# fetch; see docs/ml.md.
ml = ["pillow>=10", "onnxruntime>=1.17"]
# Training a controller. Gymnasium only: the algorithm is whichever library
# you already like, and pinning one here would be picking a side.
rl = ["gymnasium>=1.0"]
dev = [
    "pillow>=10",
    # The RL env's tests run in CI. Gymnasium is small and pure Python, so
    # this costs nothing; onnxruntime is deliberately absent, because the SAM
    # tests run against fake sessions and checking arithmetic does not need a
    # 45 MB checkpoint.
    "gymnasium>=1.0",
    # The build backend, so the tests can import the metadata hook in
    # hatch_build.py and check the README rewriting it does.
    "hatchling>=1.21",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Pinned to a minor range: ruff gains rules and formatting opinions
    # between releases, and an unrelated upgrade should not turn CI red on a
    # branch that changed nothing. Bump deliberately.
    "ruff>=0.16,<0.17",
    # Pinned to a minor range for the same reason as ruff: type checkers
    # get stricter between releases.
    "mypy>=2.3,<2.5",
    "matplotlib>=3.7",
    "types-PyYAML",
    # tomllib landed in the standard library in 3.11; the packaging tests
    # read pyproject.toml and still have to run on our 3.10 floor.
    "tomli; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/JGalego/ZimaBlue"
Documentation = "https://github.com/JGalego/ZimaBlue/tree/main/docs"
Changelog = "https://github.com/JGalego/ZimaBlue/blob/main/CHANGELOG.md"
Repository = "https://github.com/JGalego/ZimaBlue"
Issues = "https://github.com/JGalego/ZimaBlue/issues"

[project.scripts]
zimablue = "zimablue.cli:main"

[tool.hatch.metadata.hooks.custom]
# Rewrites the README's repository-relative image and link URLs to absolute
# ones, so the PyPI page is not a wall of broken images. See hatch_build.py.
path = "hatch_build.py"

[tool.hatch.version]
# Single source of truth. Duplicating the number in pyproject.toml is how a
# release ends up tagged v0.2.0 and published as 0.1.0.
path = "src/zimablue/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zimablue"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the example scenarios so `zimablue run kidney` works from a plain
# `pip install`, not just from a git clone.
"scenarios" = "zimablue/data/scenarios"

[tool.hatch.build.targets.sdist]
# The rendered GIFs are 4 MB and the executed tour notebook is 1.5 MB of
# stored plot images -- together, most of a source distribution, for files
# nobody reads out of a tarball. Both are one click away on GitHub.
exclude = ["docs/assets", "runs", ".github", "examples/tour.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:zimablue.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH"]
ignore = [
    "B008",   # typer uses function calls in argument defaults
    "RUF012", # mutable class attrs need ClassVar; noisy for dataclass-ish config
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E501"]

[tool.mypy]
# No python_version pin. It applies to the *stubs* mypy reads as well as to our
# code, and NumPy's stubs now use PEP 695 `type` statements, which mypy rejects
# when told to analyse as 3.10 -- a third-party release turns CI red for a
# syntax we never wrote. The 3.10 floor is enforced where it belongs: ruff's
# target-version for our syntax, and the test matrix for real behaviour.
files = ["src/zimablue"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
