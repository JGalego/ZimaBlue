[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "zimablue"
dynamic = ["readme", "version"]
description = "Simulate, test, and replay robotic pool cleaners."
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "JGalego" }]
keywords = [
    "robotics",
    "simulation",
    "pool-cleaner",
    "coverage-path-planning",
    "digital-twin",
    "replay",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = [
    # The build backend, so the tests can import the metadata hook in
    # hatch_build.py and check the README rewriting it does.
    "hatchling>=1.21",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Pinned to a minor range: ruff gains rules and formatting opinions
    # between releases, and an unrelated upgrade should not turn CI red on a
    # branch that changed nothing. Bump deliberately.
    "ruff>=0.16,<0.17",
    "mypy>=1.8",
    "matplotlib>=3.7",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/JGalego/ZimaBlue"
Documentation = "https://github.com/JGalego/ZimaBlue/tree/main/docs"
Changelog = "https://github.com/JGalego/ZimaBlue/blob/main/CHANGELOG.md"
Repository = "https://github.com/JGalego/ZimaBlue"
Issues = "https://github.com/JGalego/ZimaBlue/issues"

[project.scripts]
zimablue = "zimablue.cli:main"

[tool.hatch.metadata.hooks.custom]
# Rewrites the README's repository-relative image and link URLs to absolute
# ones, so the PyPI page is not a wall of broken images. See hatch_build.py.
path = "hatch_build.py"

[tool.hatch.version]
# Single source of truth. Duplicating the number in pyproject.toml is how a
# release ends up tagged v0.2.0 and published as 0.1.0.
path = "src/zimablue/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/zimablue"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the example scenarios so `zimablue run kidney` works from a plain
# `pip install`, not just from a git clone.
"scenarios" = "zimablue/data/scenarios"

[tool.hatch.build.targets.sdist]
# The rendered GIFs are 4 MB and are only there for the README on GitHub.
# Nobody needs them inside a source distribution.
exclude = ["docs/assets", "runs", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:zimablue.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH"]
ignore = [
    "B008",   # typer uses function calls in argument defaults
    "RUF012", # mutable class attrs need ClassVar; noisy for dataclass-ish config
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/zimablue"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
