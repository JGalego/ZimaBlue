name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      - name: Smoke-test the CLI
        run: |
          zimablue --version
          zimablue list
          zimablue run scenarios/rectangular.yaml --minutes 1 --record /tmp/ci.zbr
          zimablue inspect /tmp/ci.zbr
          zimablue replay /tmp/ci.zbr --summary /tmp/ci.png
