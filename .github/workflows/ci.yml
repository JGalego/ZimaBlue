name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    # Codecov authenticates by OIDC when it can, which needs a token minted by
    # the workflow. Without this the action's "Get OIDC token" step succeeds
    # and hands back nothing, and the upload is rejected as tokenless.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q --cov=zimablue --cov-report=xml --cov-report=term:skip-covered

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          # Codecov no longer accepts anonymous uploads: without either OIDC
          # (see the job's id-token permission) or this secret the upload is
          # rejected with "Token required - not valid tokenless upload", and
          # the badge reads "unknown" while CI stays green.
          token: ${{ secrets.CODECOV_TOKEN }}
          # A coverage host being down should not turn the build red.
          fail_ci_if_error: false

      - name: Smoke-test the CLI
        run: |
          zimablue --version
          zimablue list
          zimablue run scenarios/rectangular.yaml --minutes 1 --record /tmp/ci.zbr
          zimablue inspect /tmp/ci.zbr
          zimablue replay /tmp/ci.zbr --summary /tmp/ci.png

  package:
    name: Build and install like a user
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: The description must render on PyPI with its images intact
        run: |
          # twine check only asks whether it renders. It does not notice that
          # every image is a relative path that PyPI cannot resolve.
          python -m pip install "readme_renderer[md]"
          python - <<'EOF'
          import glob, re, sys, zipfile
          import readme_renderer.markdown as md
          meta = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          name = [n for n in meta.namelist() if n.endswith("METADATA")][0]
          body = meta.read(name).decode().split("\n\n", 1)[1]
          relative = [u for u in re.findall(r'<img[^>]+src="([^"]+)"', body)
                      if not u.startswith("http")]
          if relative:
              sys.exit(f"relative image URLs in the description: {relative}")
          html = md.render(body)
          if html is None:
              sys.exit("PyPI would reject this description")
          if html.count("<img") < 5:
              sys.exit("images were stripped by PyPI's sanitiser")
          print(f"description renders with {html.count('<img')} images")
          EOF

      - name: Install the wheel with no extras
        run: |
          # The repo has a scenarios/ directory and the dev extras; a user has
          # neither. Packaging bugs are invisible until you install this way.
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl

      - name: Run it
        run: |
          cd /tmp
          /tmp/fresh/bin/zimablue --version
          /tmp/fresh/bin/zimablue list
          /tmp/fresh/bin/zimablue run kidney --minutes 0.5 --quiet
          /tmp/fresh/bin/python -c "import zimablue, sys; assert 'matplotlib' not in sys.modules"

      - name: Drawing without the viz extra should advise, not crash
        run: |
          cd /tmp
          /tmp/fresh/bin/zimablue run kidney --minutes 0.5 --quiet --record /tmp/ci.zbr
          if /tmp/fresh/bin/zimablue replay /tmp/ci.zbr --summary /tmp/ci.png; then
            echo "::error::expected a clean failure without matplotlib"
            exit 1
          fi
          /tmp/fresh/bin/zimablue replay /tmp/ci.zbr --summary /tmp/ci.png 2>&1 \
            | grep -q "zimablue\[viz\]"
