name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Codecov authenticates by OIDC when it can, which needs a token minted by
    # the workflow. Without this the action's "Get OIDC token" step succeeds
    # and hands back nothing, and the upload is rejected as tokenless.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        shard: ["a-o", "p-z"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        shell: bash
        run: |
          if [[ "${{ matrix.shard }}" == "a-o" ]]; then
            tests=()
            for path in tests/test_[a-o]*.py; do
              [[ "$path" == "tests/test_examples.py" ]] || tests+=("$path")
            done
          else
            tests=(tests/test_[p-z]*.py)
          fi
          if [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            pytest "${tests[@]}" -n 2 --dist worksteal --cov=zimablue \
              --cov-report=xml:coverage-${{ matrix.shard }}.xml \
              --cov-report=term:skip-covered
          else
            pytest "${tests[@]}" -n 2 --dist worksteal
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-${{ matrix.shard }}.xml
          flags: tests-${{ matrix.shard }}
          # Codecov no longer accepts anonymous uploads. use_oidc trades the
          # workflow's identity (hence the job's id-token permission) for an
          # upload token, needing no secret at all -- the action defaults it to
          # false, so granting the permission alone changes nothing. The secret
          # is the fallback, and the only option if this repo is made private.
          #
          # A credential is necessary and not sufficient: the repository also
          # has to be enabled at codecov.io, or the upload comes back
          # "Repository not found". See RELEASING.md.
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # A coverage host being down should not turn the build red.
          fail_ci_if_error: false

      - name: Smoke-test the CLI
        if: matrix.shard == 'a-o'
        run: |
          zimablue --version
          zimablue list
          zimablue run scenarios/rectangular.yaml --minutes 1 --record /tmp/ci.zbr
          zimablue inspect /tmp/ci.zbr
          zimablue replay /tmp/ci.zbr --summary /tmp/ci.png

  examples:
    name: Examples (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        group: ["scripts", "dynamics", "notebook"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test examples
        shell: bash
        run: |
          case "${{ matrix.group }}" in
            scripts) expression="not notebook and not analyse_dynamics and not batch_experiment" ;;
            dynamics) expression="analyse_dynamics or batch_experiment" ;;
            notebook) expression="notebook" ;;
          esac
          pytest tests/test_examples.py -k "$expression" -n 2 --dist worksteal \
            --cov=zimablue --cov-report=xml:coverage-examples-${{ matrix.group }}.xml \
            --cov-report=term:skip-covered

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage-examples-${{ matrix.group }}.xml
          flags: tests-examples-${{ matrix.group }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  package:
    name: Build and install like a user
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check metadata
        run: python -m twine check --strict dist/*

      - name: The description must render on PyPI with its images intact
        run: |
          # twine check only asks whether it renders. It does not notice that
          # every image is a relative path that PyPI cannot resolve.
          python -m pip install "readme_renderer[md]"
          python - <<'EOF'
          import glob, re, sys, zipfile
          import readme_renderer.markdown as md
          meta = zipfile.ZipFile(glob.glob("dist/*.whl")[0])
          name = [n for n in meta.namelist() if n.endswith("METADATA")][0]
          body = meta.read(name).decode().split("\n\n", 1)[1]
          relative = [u for u in re.findall(r'<img[^>]+src="([^"]+)"', body)
                      if not u.startswith("http")]
          if relative:
              sys.exit(f"relative image URLs in the description: {relative}")
          html = md.render(body)
          if html is None:
              sys.exit("PyPI would reject this description")
          if html.count("<img") < 5:
              sys.exit("images were stripped by PyPI's sanitiser")
          print(f"description renders with {html.count('<img')} images")
          EOF

      - name: Install the wheel with no extras
        run: |
          # The repo has a scenarios/ directory and the dev extras; a user has
          # neither. Packaging bugs are invisible until you install this way.
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl

      - name: Run it
        run: |
          cd /tmp
          /tmp/fresh/bin/zimablue --version
          /tmp/fresh/bin/zimablue list
          /tmp/fresh/bin/zimablue run kidney --minutes 0.5 --quiet
          /tmp/fresh/bin/python -c "import zimablue, sys; assert 'matplotlib' not in sys.modules"

      - name: Drawing without the viz extra should advise, not crash
        run: |
          cd /tmp
          /tmp/fresh/bin/zimablue run kidney --minutes 0.5 --quiet --record /tmp/ci.zbr
          if /tmp/fresh/bin/zimablue replay /tmp/ci.zbr --summary /tmp/ci.png; then
            echo "::error::expected a clean failure without matplotlib"
            exit 1
          fi
          /tmp/fresh/bin/zimablue replay /tmp/ci.zbr --summary /tmp/ci.png 2>&1 \
            | grep -q "zimablue\[viz\]"
